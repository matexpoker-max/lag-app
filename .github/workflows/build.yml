name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Unpack the app project
        run: unzip -o -q project.zip -d proj && ls -R proj | head -60
      - name: Make the icons from the site's logo
        run: |
          pip install --quiet pillow
          curl -fsSL -o logo.png https://lifesagambol.com/images/logo.png
          cd proj && python3 make_icons.py ../logo.png
      - name: The upload key (only when its secrets are set — never from the repo)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; echo "signed=yes"; else echo "signed=no (the bundle is unsigned)"; fi
      - name: Build
        working-directory: proj
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease
      - name: Turn on the emulator's speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Try it on a virtual Android phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash proj/emu-test.sh
      - name: Publish the build and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/debug/app-debug.apk out/lifesagambol-test.apk || true
          if [ -n "$UPLOAD_KEYSTORE" ]; then cp proj/app/build/outputs/bundle/release/app-release.aab out/lifesagambol-release.aab || true; else cp proj/app/build/outputs/bundle/release/app-release.aab out/lifesagambol-unsigned.aab || true; fi
          rm -f "$RUNNER_TEMP/upload.jks" || true
          cp proj/store/icon-512.png out/ || true
          cp shots/* out/ || true
          gh release create "build-${{ github.run_number }}" out/* --title "Build ${{ github.run_number }}" --notes "Test build ${{ github.run_number }} (commit ${{ github.sha }})" --prerelease

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the iPhone project
        run: unzip -o -q ios.zip -d ios && ls -R ios | head -50
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Make the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a virtual iPhone
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          plain=[x for x in c if re.fullmatch(r'iPhone 1[5-9]', x['name'])]
          pick=(plain or c)[-1]
          print(pick['udid'])
          print(pick['name'], file=sys.stderr)")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ios
        run: |
          rc=0; xcodebuild -project LAGGames.xcodeproj -scheme LAGGames -configuration Debug -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || rc=$?
          grep -E "error:|warning:|BUILD" build.log | head -100
          [ $rc -eq 0 ] || exit $rc
          # a delegate method whose shape does not match is never called — never let that pass quietly
          if grep -E "nearly matches|will never be executed" build.log; then echo "A delegate method does not match its protocol"; exit 1; fi
      - name: Tests (the App Store bridge against Xcode's test store, and where links go)
        working-directory: ios
        run: |
          rc=0; xcodebuild -project LAGGames.xcodeproj -scheme LAGGames -configuration Debug -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO test > test.log 2>&1 || rc=$?
          grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)|Executed" test.log | head -150
          exit $rc
      - name: Run it on the virtual iPhone
        if: always()
        run: bash ios/ios-test.sh
      - name: Publish the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p iout
          cp ishots/* iout/ 2>/dev/null || true
          cp ios/build.log iout/ios-build.log 2>/dev/null || true
          cp ios/test.log iout/ios-test.log 2>/dev/null || true
          gh release create "ios-${{ github.run_number }}" iout/* --title "iPhone build ${{ github.run_number }}" --notes "iPhone simulator build ${{ github.run_number }} (commit ${{ github.sha }})" --prerelease
