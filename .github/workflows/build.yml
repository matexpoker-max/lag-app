name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Unpack the app project
        run: unzip -o -q project.zip -d proj && ls -R proj | head -60
      - name: Make the icons from the site's logo
        run: |
          pip install --quiet pillow
          curl -fsSL -o logo.png https://lifesagambol.com/images/logo.png
          cd proj && python3 make_icons.py ../logo.png
      - name: The upload key (only when its secrets are set — never from the repo)
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; echo "signed=yes"; else echo "signed=no (the bundle is unsigned)"; fi
      - name: Build
        working-directory: proj
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease
      - name: Turn on the emulator's speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Try it on a virtual Android phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash proj/emu-test.sh
      - name: Publish the build and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/debug/app-debug.apk out/lifesagambol-test.apk || true
          if [ -n "$UPLOAD_KEYSTORE" ]; then cp proj/app/build/outputs/bundle/release/app-release.aab out/lifesagambol-release.aab || true; else cp proj/app/build/outputs/bundle/release/app-release.aab out/lifesagambol-unsigned.aab || true; fi
          rm -f "$RUNNER_TEMP/upload.jks" || true
          cp proj/store/icon-512.png out/ || true
          cp shots/* out/ || true
          gh release create "build-${{ github.run_number }}" out/* --title "Build ${{ github.run_number }}" --notes "Test build ${{ github.run_number }} (commit ${{ github.sha }})" --prerelease
